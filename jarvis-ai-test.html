
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS — Local AI Test</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0b0d12;
      color: #e8edf7;
      font: 16px system-ui, sans-serif;
      max-width: 760px;
      margin-inline: auto;
    }
    h1 { letter-spacing: 3px; }
    button, input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3b465b;
      background: #151b26;
      color: inherit;
      font: inherit;
    }
    button { cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    input { flex: 1; min-width: 0; }
    #chat {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }
    .msg {
      padding: 12px;
      border: 1px solid #283246;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { border-color: #426eac; }
    #status { color: #9db5d8; min-height: 24px; }
    form { display: flex; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>J.A.R.V.I.S.</h1>
  <p>Local AI prototype — no cloud AI API.</p>

  <button id="load">Load local model</button>
  <p id="status">Model not loaded.</p>

  <form id="form">
    <input id="prompt"
      placeholder="Say something to JARVIS..."
      autocomplete="off">
    <button id="send" type="submit" disabled>Send</button>
  </form>

  <div id="chat" aria-live="polite"></div>

  <script type="module">
    import { CreateMLCEngine }
      from "https://esm.run/@mlc-ai/web-llm";

    const MODEL = "Llama-3.2-1B-Instruct-q4f16_1-MLC";

    const status = document.querySelector("#status");
    const loadButton = document.querySelector("#load");
    const sendButton = document.querySelector("#send");
    const promptInput = document.querySelector("#prompt");
    const chat = document.querySelector("#chat");

    let engine = null;
    let busy = false;

    const history = [{
      role: "system",
      content:
        "You are JARVIS, a concise, friendly personal assistant. " +
        "This is a local AI test. Do not claim access to the user's " +
        "apps, files, habits, or live data. Answer honestly."
    }];

    function addMessage(role, text) {
      const item = document.createElement("div");
      item.className = "msg " + role;
      item.textContent =
        (role === "user" ? "YOU\n" : "JARVIS\n") + text;
      chat.appendChild(item);
    }

    loadButton.addEventListener("click", async () => {
      if (engine || busy) return;

      if (!navigator.gpu) {
        status.textContent =
          "WebGPU is unavailable in this browser. Try a current " +
          "version of Chrome or Edge on your Mac.";
        return;
      }

      busy = true;
      loadButton.disabled = true;
      status.textContent = "Preparing local AI...";

      try {
        engine = await CreateMLCEngine(MODEL, {
          initProgressCallback: (progress) => {
            status.textContent =
              progress.text ||
              ("Loading model: " +
                Math.round((progress.progress || 0) * 100) + "%");
          }
        });

        status.textContent =
          "Model ready. Your prompts run on this device.";
        sendButton.disabled = false;
        loadButton.textContent = "Model loaded";
      } catch (error) {
        engine = null;
        status.textContent =
          "Model failed to load: " + error.message;
        loadButton.disabled = false;
      } finally {
        busy = false;
      }
    });

    document.querySelector("#form").addEventListener(
      "submit", async (event) => {
        event.preventDefault();

        const text = promptInput.value.trim();
        if (!text || !engine || busy) return;

        busy = true;
        sendButton.disabled = true;
        promptInput.value = "";
        addMessage("user", text);
        history.push({ role: "user", content: text });

        try {
          const response = await engine.chat.completions.create({
            messages: [
              history[0],
              ...history.slice(-10)
            ],
            temperature: 0.4,
            max_tokens: 180
          });

          const answer =
            response.choices?.[0]?.message?.content ||
            "I couldn't generate a response.";

          history.push({
            role: "assistant",
            content: answer
          });

          addMessage("assistant", answer);

          // Keep conversation history bounded.
          if (history.length > 13) {
            history.splice(1, history.length - 11);
          }
        } catch (error) {
          addMessage("assistant", "Error: " + error.message);
          status.textContent = "Generation failed.";
        } finally {
          busy = false;
          sendButton.disabled = false;
          promptInput.focus();
        }
      }
    );
  </script>
</body>
</html>
